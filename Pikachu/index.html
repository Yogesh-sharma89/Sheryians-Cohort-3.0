<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon</title>
    <link
      href="
https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css
"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- left  -->
      <div class="left">
        <img src="./logo.png" alt="Pokemon Logo" class="logo" />

        <div class="content">
          <p class="gen-para">pokemon gen i</p>
          <h1>Pikachu</h1>
          <p class="detail-para">
            Pikachu is an Electric-type pokemon introduced in Generation I.
            Pikachu are small , chubby and incredibly cute mouse-like Pokemon.
            They are almost covered by yellow fur.
          </p>
          <div class="info">
            <div class="line"></div>
            <p class="count">01 <span>/</span> 08</p>
          </div>
        </div>

        <div class="pokeball-container">
          <img src="./pokeball.png" alt="pokeball image" />
        </div>
      </div>
      <!-- right -->
      <div class="right">
        <div class="menu-container">
        <i class="ri-menu-line"></i>
        </div>
        <img src="./Pikachu-PNG-File.png" alt="pikachu image">
        <div class="dot-container">
          <div class="dot first"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>

        </div>
      </div>
    
    </main>
  </body>
</html>
